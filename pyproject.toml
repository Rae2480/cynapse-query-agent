[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cynapse-query-agent"
version = "0.1.0"
description = "LangGraph CCTV query assignment starter"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
openai = ["langchain>=1,<2", "langchain-openai>=1,<2"]

[project.scripts]
cynapse = "cynapse.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
